name: Supabase Keepalive

on:
  schedule:
    # 每天 UTC 02:17(北京时间 10:17)跑一次。
    # 故意用每天而不是掐第 6 天,给 GitHub cron 的高峰延迟留足冗余。
    - cron: "17 2 * * *"
  workflow_dispatch:   # 允许在 Actions 页手动点一下立刻跑

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: "https://ruwahgoignduzggibpab.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_s2apoFv4811AO8dZIu46QQ_Gt-r99l3"
        run: |
          echo "🫀 Pinging Supabase at $(date -u)"
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/inventory?select=code&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${HTTP_CODE}"
          echo "响应: $(cat /tmp/resp.txt)"
          # 2xx/3xx/4xx 都说明网关+数据库已响应(醒着);只有 5xx / 000 才算失败
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 500 ]; then
            echo "✅ Supabase 已保活(HTTP ${HTTP_CODE})"
          else
            echo "❌ 保活失败(HTTP ${HTTP_CODE})—— 项目可能已暂停,去 Dashboard 手动 Resume"
            exit 1
          fi